name: Update Stash overrides

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Convert tracked Loon plugins
        run: python3 scripts/convert-loon-to-stash.py

      - name: Verify generated files
        run: git diff --check

      - name: Commit updates
        run: |
          if git diff --quiet -- rules/stash; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/stash
          git commit -m "chore: update Stash overrides from Loon sources"
          git push
