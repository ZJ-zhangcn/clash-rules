rules:
- DOMAIN,acemcp.heroman.wtf,DIRECT
- GEOSITE,category-ads-all,REJECT
- RULE-SET,DNS,全部
- RULE-SET,Customer-Proxy-All,全部
- RULE-SET,Customer-Proxy-HK,香港自动策略
- RULE-SET,Customer-Proxy-JP,日本自动策略
- RULE-SET,Customer-Proxy-USGT,美国自建GT
- RULE-SET,Customer-Direct,DIRECT
- RULE-SET,Customer-Proxy-US,美国自建
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,google-cn,DIRECT
- GEOSITE,synology,DIRECT
- DOMAIN-SUFFIX,sharepoint.com,DIRECT
- RULE-SET,SpeedtestIntl,Speedtest国际
- RULE-SET,Game,游戏选择
- RULE-SET,Disney,美国自建GT
- RULE-SET,YouTube,全部
- RULE-SET,Google,AI
- RULE-SET,Bahamut,台湾自动策略
- RULE-SET,GitHub,全部
- RULE-SET,PayPal,家宽链式代理
- GEOSITE,openai,AI
- GEOSITE,anthropic,AI
- GEOSITE,google-gemini,AI
- GEOSITE,xai,AI
- AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
- GEOSITE,gfw,全部
- GEOSITE,cn,DIRECT
- GEOIP,CN,DIRECT,no-resolve
- MATCH,全部
