# Stash remote profile — uses the live Sub-Store collection; no nodes are embedded here.
# Keeps the Mac routing groups, custom rule providers, and routing order aligned.
# Mobile-only adjustment: automatic benchmarks run every 300 seconds instead of 6.
mode: rule
log-level: info
ipv6: true
dns:
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:apple:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:private: system
    geosite:google-cn:
    - 223.5.5.5
    - 119.29.29.29
    geosite:synology:
    - 223.5.5.5
    - 119.29.29.29
    "*.linux.do": https://xxx.ddd.oaifree.com/query-dns
    linux.do: https://xxx.ddd.oaifree.com/query-dns
    geosite:openai:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    geosite:anthropic:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    geosite:google-gemini:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    geosite:xai:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  follow-rule: false
proxy-groups:
- name: 全部
  type: fallback
  interval: 300
  lazy: true
  proxies:
  - 日本自建
  - 美国自建
  - 日本自动策略
  - 香港自动策略
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
- name: AI
  type: fallback
  interval: 300
  lazy: true
  proxies:
  - 家宽链式代理
  - 美国自建
  - 日本自建
  - 全部
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
- name: 服务器
  type: fallback
  interval: 300
  lazy: true
  proxies:
  - 美国自建
  - 全部
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
- name: 美国自建
  type: fallback
  interval: 300
  lazy: true
  filter: "^(?=.*(?:美国-自建))(?!.*(?:回国|校园|游戏|GAME|美国-自建1-zgo-http|美国-自建2)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 美国自建GT
  type: fallback
  interval: 300
  lazy: true
  filter: "^(?=.*(?:美国-自建2))(?!.*(?:回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 日本自建
  type: fallback
  interval: 300
  lazy: true
  filter: "^(?=.*\\b日本-自建)(?!.*((?i)回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 游戏选择
  type: select
  filter: "^(?=.*(.))(?!.*((?i)群|邀请|返利|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\\d{4}-\\d{2}-\\d{2}|\\dG)).*$"
  proxies:
  - PASS
  - DIRECT
  use:
  - sub-store
- name: 家宽链式代理
  type: fallback
  interval: 300
  lazy: true
  filter: "^.*(?i)(自建家宽).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: Speedtest国际
  type: select
  filter: "^(?=.*(.))(?!.*((?i)群|邀请|返利|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|\\d{4}-\\d{2}-\\d{2}|\\dG)).*$"
  proxies:
  - PASS
  - DIRECT
  use:
  - sub-store
- name: 香港自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)港|HK|HKG|Hong(?:Kong)?))(?!.*((?i)回国|校园|游戏|GAME|自建)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 日本自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)日|JP|JPN|Japan))(?!.*((?i)回国|校园|游戏|GAME|自建)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 新国自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)新|SG|SGP|Singapore))(?!.*((?i)回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 美国自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|USA|United(?:\\s)?States))(?!.*((?i)回国|校园|游戏|GAME|自建|美国-三网精品|美国-zgo)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 台湾自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)台|TW|TWN|Tai(?:wan)?))(?!.*((?i)回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 韩国自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)韩|KR|KOR|Korea))(?!.*((?i)回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 英国自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)英|UK|GBR|United(?:\\s)?Kingdom|伦敦))(?!.*((?i)回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 法国自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)法|FR|FRA|France))(?!.*((?i)回国|校园|游戏|GAME)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
- name: 德国自动策略
  type: url-test
  interval: 300
  tolerance: 20
  lazy: true
  filter: "^(?=.*((?i)德|DE|DEU|Germany))(?!.*((?i)回国|校园|游戏|GAME|自建)).*$"
  benchmark-url: http://www.google.com/blank.html
  benchmark-timeout: 2
  use:
  - sub-store
